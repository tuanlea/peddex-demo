<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spaceship Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- THE LOBBY OVERLAY -->
<div id="lobbyOverlay" class="lobby-overlay">
    <div class="lobby-card">
        <h2>Welcome to WebGame</h2>
        <input type="text" id="usernameInput" placeholder="Enter your name..." autocomplete="off">
        <button id="joinGameBtn">Join Game</button>
    </div>
</div>


<div class="chat-container">
    <!-- This is our new game board! -->
    <div id="gameContainer" style="flex: 1; display: flex; justify-content: center; align-items: center; min-height: 0; background-color: #000; border-bottom: 2px solid #334155;">
        <canvas id="gameCanvas" width="1280" height="800" style="background-color: #0f172a; max-width: 100%; max-height: 100%; aspect-ratio: 16/10;"></canvas>
    </div>

    <div class="chat-messages" id="messages">
        <div class="message system">Connecting to server...</div>
    </div>
    <div class="chat-input-container">
        <input type="text" id="messageInput" placeholder="Type a message..." disabled>
        <button id="sendButton" disabled>Send</button>
    </div>
</div>

<script type="module" src="main.js"></script>

</body>
</html>
